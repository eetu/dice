# One Rust workspace for the dice backend (+ integration tests later). Crates
# share this [workspace.dependencies] table, one Cargo.lock, and one target/.
[workspace]
resolver = "2"
members = [
    "backend",
    "integration",
]

[workspace.package]
edition = "2021"
version = "1.0.7"

[workspace.dependencies]
axum = { version = "0.8", features = ["macros", "tokio", "tracing"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "set-header", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
dotenvy = "0.15"
rand = "0.10"

# OpenTelemetry metrics + log export (opt-in: only active when an OTLP endpoint
# is configured). http-proto + reqwest-rustls-webpki-roots = a pure-Rust path (no
# openssl, no tonic/gRPC) so the xx → scratch cross-compile stays unchanged.
# `logs` carries the browser error reports (see routes::client_error) and the
# backend's own warn!/error! lines; appender-tracing is the tracing→OTel bridge.
opentelemetry = { version = "0.32", default-features = false, features = ["metrics", "logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["metrics", "logs", "http-proto", "reqwest-blocking-client", "reqwest-rustls-webpki-roots"] }
opentelemetry-appender-tracing = { version = "0.32", default-features = false }

# dev-deps (used by the integration crate)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
# default-features=false → no native-tls/openssl; plain ws:// only (tests are loopback).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"
