name: Automerge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Native GitHub auto-merge: GitHub squash-merges the PR once the REQUIRED checks
    # pass (`ci-gate`, per the protect-main ruleset). "Required" is the whole point —
    # this repo's CI skips jobs by path filter, and the custom action this replaces
    # counted a SKIPPED job as still-pending, so it polled until its own timeout and
    # left every dependabot PR red on otherwise-green CI. Native auto-merge only ever
    # waits on required checks, so a skipped job cannot block it by construction.
    #
    # Only dependabot. Skip github-actions bumps — a squash merge re-authors the
    # workflow-file change as GITHUB_TOKEN, which lacks the `workflows` scope and is
    # rejected; merge those by hand after reviewing the CI change.
    if: github.actor == 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/github_actions')
    steps:
      # No `actions/checkout` needed — nothing is read from the tree, so the
      # checkout SHA that PR #6 bumped on the other side of this conflict is moot.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
