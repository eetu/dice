name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            image:
              - 'backend/**'
              - 'frontend/**'
              - 'Cargo.*'
              - 'Dockerfile'
              # Rebuild when the build definition itself changes (e.g. platforms).
              - '.github/workflows/dockerimage.yaml'

  build:
    needs: changes
    if: needs.changes.outputs.image == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            # Rolling aliases: `1` follows the latest v1.x.y, `1.0` the latest
            # v1.0.x — servers can pin a major (or minor) and pick up releases
            # without touching IaC on every version bump.
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Multi-arch: arm64 (e.g. a Raspberry Pi) + amd64 (x86 cloud hosts).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Prune image versions that nothing references, keeping the 5 newest — the
      # housekeeping actions/delete-package-versions@v5 used to do. Inlined against
      # the REST API because that action is unmaintained (last release Jan 2024, still
      # declares `using: node20`, which the runners now force onto node24 with a
      # deprecation warning) — and this keeps a third-party action out of the job
      # that publishes the deployed image.
      #
      # "Untagged" does NOT mean "orphaned", which is the trap the first version of
      # this step fell into. A multi-arch tag puts the tag on the INDEX; the index's
      # per-architecture child manifests are separate, UNTAGGED versions referenced
      # only by digest. They are the image itself, not build leftovers. Deleting them
      # leaves a tagged index pointing at nothing, and the tag stops being pullable on
      # every platform while still looking present in the UI.
      #
      # That is exactly what happened on 2026-09-04: both children of the `1` index
      # were pruned, so `ghcr.io/eetu/dice:1` became unpullable and the invinite-tech
      # host's podman-auto-update started failing nightly. The running container only
      # survived because the image was already in its local storage — a server
      # recreate would have left dice unable to start.
      #
      # So: collect every digest referenced by a tagged index and never consider those,
      # then keep the 5 newest of whatever genuinely is unreferenced. Pruning is
      # housekeeping and must never fail a release: `continue-on-error` covers a token
      # or registry hiccup, and the cap below stops a surprising API response from
      # turning into a mass delete.
      - name: Prune unreferenced image versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
          KEEP: "5"
        run: |
          set -euo pipefail
          versions="$RUNNER_TEMP/versions.json"
          gh api --paginate \
            "/users/$OWNER/packages/container/$PACKAGE/versions?per_page=100" > "$versions"

          # Digests referenced by a tagged index — never deletion candidates. buildx is
          # already set up and logged in above, so `imagetools inspect` needs no extra
          # token dance. A single-arch manifest simply has no `.manifests`.
          keep="$RUNNER_TEMP/keep-digests.txt"
          : > "$keep"
          for tag in $(jq -r '.[] | .metadata.container.tags[]?' "$versions" | sort -u); do
            docker buildx imagetools inspect --raw "ghcr.io/$OWNER/$PACKAGE:$tag" 2>/dev/null \
              | jq -r '.manifests[]?.digest' >> "$keep" || true
          done
          sort -u -o "$keep" "$keep"
          echo "digests referenced by tagged indexes: $(grep -c . "$keep" || true)"

          # Fail CLOSED: if the keep-set came back empty while tagged multi-arch images
          # exist, something is wrong with the registry read and we must not delete on
          # the strength of a blank answer.
          if ! [ -s "$keep" ] && jq -e 'any(.[]; (.metadata.container.tags // []) | length > 0)' "$versions" >/dev/null; then
            echo "tagged versions exist but no referenced digests were read — not pruning" >&2
            exit 1
          fi

          # Candidates: untagged AND unreferenced, minus the newest $KEEP of those.
          stale="$RUNNER_TEMP/stale-versions.txt"
          jq -r '.[] | select((.metadata.container.tags // []) | length == 0)
                     | "\(.created_at)\t\(.id)\t\(.name)"' "$versions" \
            | sort -r \
            | while IFS=$'\t' read -r created id digest; do
                grep -qxF "$digest" "$keep" || printf '%s\t%s\n' "$created" "$id"
              done \
            | tail -n "+$((KEEP + 1))" | cut -f2 > "$stale"

          count=$(grep -c . "$stale" || true)
          echo "unreferenced untagged versions beyond the newest $KEEP: $count"
          if [ "$count" -gt 50 ]; then
            echo "refusing to delete $count versions in one run — check the API response" >&2
            exit 1
          fi
          while read -r id; do
            [ -n "$id" ] || continue
            echo "deleting unreferenced version $id"
            gh api -X DELETE "/users/$OWNER/packages/container/$PACKAGE/versions/$id" \
              || echo "warn: could not delete $id" >&2
          done < "$stale"
